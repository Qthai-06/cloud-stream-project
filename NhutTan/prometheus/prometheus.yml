global:
  scrape_interval: 3s
  evaluation_interval: 3s
  scrape_timeout: 2s

alerting:
  alertmanagers: []

rule_files: []

scrape_configs:
  # 1. Tự giám sát Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Giám sát tài nguyên phần cứng Container qua cAdvisor / Host Exporter (Tuần 1-2 & Tuần 3)
  - job_name: 'cadvisor'
    scrape_interval: 2s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['cadvisor:8080', 'host.containers.internal:8000', '10.89.0.1:8000']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'container_.*'
        action: keep

  # 3. Giám sát Message Broker Redpanda (Kafka-compatible)
  - job_name: 'redpanda'
    scrape_interval: 5s
    metrics_path: '/public_metrics'
    static_configs:
      - targets: ['redpanda:9644']

  # 4. Giám sát Spark Structured Streaming Engine (Tuần 4)
  - job_name: 'spark_streaming'
    scrape_interval: 2s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['spark-processor:8000', 'host.containers.internal:8000', '10.89.0.1:8000', 'host.docker.internal:8000']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'spark_streaming_.*'
        action: keep
